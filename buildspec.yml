version: 0.2

phases:
  install:
    commands:
      - echo "Docker is already available in this image"
      - docker version
      - docker pull public.ecr.aws/k9v9d5v2/accuknox-aspm-scanner:v0.9.1

  build:
    commands:
      - echo "Running AccuKnox scanner..."
      - docker run --rm \
          -e ACCUKNOX_TOKEN="$ACCUKNOX_TOKEN" \
          -e ACCUKNOX_TENANT="$ACCUKNOX_TENANT" \
          -e ACCUKNOX_ENDPOINT="$ACCUKNOX_ENDPOINT" \
          -e ACCUKNOX_LABEL="$ACCUKNOX_LABEL" \
          -e SCAN_IMAGE="$SCAN_IMAGE" \
          public.ecr.aws/k9v9d5v2/accuknox-aspm-scanner:v0.9.1 \
          scan --softfail sast
