version: 0.2  
env:
  variables:
    SOFT_FAIL: "true"
    DIRECTORY: "."
    COMPACT: "true"
    QUIET: "true"
    RESULTS: ""
    BRANCH: "all"
    EXCLUDE_PATHS: ""
    TARGET_URL: "http://testasp.vulnweb.com/"
    SEVERITY_THRESHOLD: "HIGH"
    DAST_SCAN_TYPE: "baseline"
    IMAGE: "gitlab"
    IMAGE_TAG: "test"
    IMAGE_TAR: "image.tar"
    SEVERITY: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
    SCAN_IMAGE: "public.ecr.aws/k9v9d5v2/trufflesecurity/trufflehog:3.90.3"

phases:
  pre_build:
    commands:
      - echo "Starting AccuKnox SAST scan"
  build:
    commands:
      - echo "Running AccuKnox sast scan"
      - |

        if [ "$SOFT_FAIL" = "true" ]; then
          SOFT_FAIL_ARG="--softfail"
        fi
        echo "Installing AccuKnox scanner..."
        pip install https://github.com/accuknox/aspm-scanner-cli/releases/download/v0.10.1/accuknox_aspm_scanner-0.10.1-py3-none-any.whl --break-system-packages
        echo "Running SAST scan..."
        accuknox-aspm-scanner scan $SOFT_FAIL_ARG sast 

