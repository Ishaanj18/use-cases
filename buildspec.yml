version: 0.2

# This replicates GitLab CI's docker:dind service approach
phases:
  install:
    commands:
      - echo "=== REPLICATING GITLAB CI DOCKER:DIND SETUP ==="
      - echo "Starting Docker-in-Docker daemon (equivalent to GitLab's docker:dind service)"
      - apt-get update
      - apt-get install -y docker.io
      
  pre_build:
    commands:
      - echo "Starting Docker daemon (GitLab docker:dind equivalent)"
      - dockerd --host=unix:///var/run/docker.sock --host=tcp://0.0.0.0:2375 --tls=false &
      - echo "Waiting for Docker daemon to be ready..."
      - timeout 30 sh -c 'until docker info; do echo "Waiting for Docker daemon..."; sleep 2; done'
      - echo "Docker daemon is ready!"
      - docker info
      - echo "Setting GitLab CI equivalent environment variables"
      - export DOCKER_HOST="tcp://localhost:2375"
      - export DOCKER_TLS_CERTDIR=""
      - export PIPELINE_ID="$CODEBUILD_BUILD_ID"
      - export JOB_URL="https://console.aws.amazon.com/codesuite/codebuild/projects/$CODEBUILD_PROJECT_NAME/builds/$CODEBUILD_BUILD_ID"
      - echo "Authenticating with Docker Hub (to avoid rate limits)"
      - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
      
  build:
    commands:
      - echo "=== RUNNING ACCUKNOX SAST SCAN ==="
      - echo "This replicates the GitLab CI accuknox-sast-scan job"
      - export REPO_URL="https://github.com/IshaanJ18/use-cases"
      - export COMMIT_SHA="$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - export COMMIT_REF="main"
      - echo "Docker is available for AccuKnox scanner:"
      - docker ps
      - echo "Running AccuKnox scan (same as GitLab CI)"
      - accuknox-aspm-scanner scan --softfail sast --pipeline-id "$PIPELINE_ID" --job-url "$JOB_URL" --repo-url "$REPO_URL" --commit-sha "$COMMIT_SHA" --commit-ref "$COMMIT_REF"

artifacts:
  files:
    - '**/*'
