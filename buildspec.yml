version: 0.2

env:
  variables:
    ECR_REGISTRY: "public.ecr.aws/k9v9d5v2"
    REGION: "us-east-1"

phases:
  pre_build:
    commands:
      - echo "Starting multi-architecture image pull tests"
      - echo "Build environment info:"
      - echo "  Platform: $(uname -m)"
      - echo "  OS: $(uname -a)"
      - echo "  Docker version: $(docker --version)"
      - echo "  Region: $REGION"
      - echo "======================================"
      
      - echo "Authenticating with ECR..."
      - aws ecr-public get-login-password --region $REGION | docker login --username AWS --password-stdin public.ecr.aws
      - echo "Authentication successful"

  build:
    commands:
      - |
        echo "Testing AccuKnox-compatible multi-architecture images..."
        echo "Simulating how AccuKnox scanner would use these images in pipeline..."
        
        # Array of images to test with their AccuKnox use cases
        declare -A IMAGES_AND_TESTS=(
          ["bridgecrew/checkov:3.2.458"]="checkov --help"
          ["accuknox/opengrepjob:0.1.0"]="echo 'OpenGrep job container'"  
          ["sonarsource/sonar-scanner-cli:11.4"]="sonar-scanner --help"
          ["zaproxy/zap-stable:2.16.1"]="zap-baseline.py --help"
          ["trufflesecurity/trufflehog:3.90.3"]="trufflehog --help"
          ["aquasec/trivy:0.65.0"]="trivy --help"
        )
        
        # Test results tracking
        TOTAL_TESTS=0
        PASSED_TESTS=0
        FAILED_TESTS=0
        CRITICAL_FAILURES=()
        
        echo "======================================"
        echo "ACCUKNOX SCANNER COMPATIBILITY TESTS"
        echo "======================================"
        echo "Current build environment: $(uname -m)"
        echo ""
        
        for image in "${!IMAGES_AND_TESTS[@]}"; do
          FULL_IMAGE="$ECR_REGISTRY/$image"
          TEST_COMMAND="${IMAGES_AND_TESTS[$image]}"
          TOTAL_TESTS=$((TOTAL_TESTS + 1))
          
          echo "Test $TOTAL_TESTS: $image"
          echo "----------------------------------------"
          
          # Critical Test 1: Architecture compatibility check
          echo "🏗️  Checking architecture compatibility..."
          MANIFEST_OUTPUT=$(docker manifest inspect "$FULL_IMAGE" 2>/dev/null || echo "FAILED")
          
          if [ "$MANIFEST_OUTPUT" != "FAILED" ]; then
            BUILD_ARCH=$(uname -m)
            DOCKER_ARCH=""
            
            # Map build architecture to Docker architecture
            case $BUILD_ARCH in
              x86_64) DOCKER_ARCH="amd64" ;;
              aarch64|arm64) DOCKER_ARCH="arm64" ;;
              *) DOCKER_ARCH="unknown" ;;
            esac
            
            ARCH_AVAILABLE=$(echo "$MANIFEST_OUTPUT" | grep -c "$DOCKER_ARCH" || echo "0")
            
            if [ "$ARCH_AVAILABLE" -gt 0 ]; then
              echo "✅ Architecture $DOCKER_ARCH available for current build environment"
            else
              echo "❌ Architecture $DOCKER_ARCH NOT available - this will cause AccuKnox scanner failures!"
              CRITICAL_FAILURES+=("$image - Missing $DOCKER_ARCH architecture")
            fi
          else
            echo "❌ Cannot inspect manifest"
            CRITICAL_FAILURES+=("$image - Manifest inspection failed")
          fi
          
          # Critical Test 2: Pull simulation (exactly how AccuKnox would do it)
          echo "🔽 Testing image pull (AccuKnox scanner simulation)..."
          PULL_START=$(date +%s)
          
          if docker pull "$FULL_IMAGE" 2>&1 | tee /tmp/pull_output; then
            PULL_END=$(date +%s)
            PULL_TIME=$((PULL_END - PULL_START))
            
            # Check what architecture was actually pulled
            PULLED_ARCH=$(docker inspect "$FULL_IMAGE" --format='{{.Architecture}}' 2>/dev/null || echo "unknown")
            PULLED_OS=$(docker inspect "$FULL_IMAGE" --format='{{.Os}}' 2>/dev/null || echo "unknown")
            
            echo "✅ Pull successful in ${PULL_TIME}s"
            echo "   - Auto-selected architecture: $PULLED_ARCH"
            echo "   - Operating system: $PULLED_OS"
            
            # Verify no platform warnings
            if grep -q "platform" /tmp/pull_output; then
              echo "⚠️  Platform warnings detected in pull output"
              cat /tmp/pull_output | grep "platform" || true
            fi
            
          else
            echo "❌ Pull failed - AccuKnox scanner will fail with this image!"
            CRITICAL_FAILURES+=("$image - Pull failed")
            cat /tmp/pull_output || true
          fi
          
          # Critical Test 3: Container execution test (simulate AccuKnox usage)
          echo "🚀 Testing container execution (AccuKnox usage simulation)..."
          
          # Test with timeout to prevent hanging
          if timeout 30 docker run --rm "$FULL_IMAGE" $TEST_COMMAND > /tmp/exec_output 2>&1; then
            echo "✅ Container execution successful"
          elif timeout 30 docker run --rm --entrypoint="" "$FULL_IMAGE" echo "Basic execution test" > /dev/null 2>&1; then
            echo "✅ Basic container execution successful"
          else
            echo "⚠️  Container execution test failed or timed out"
            echo "   This might indicate issues with AccuKnox scanner usage"
            head -5 /tmp/exec_output 2>/dev/null || true
          fi
          
          # Test 4: Resource verification
          echo "💾 Checking resource requirements..."
          IMAGE_SIZE=$(docker images "$FULL_IMAGE" --format "{{.Size}}")
          echo "   - Image size: $IMAGE_SIZE"
          
          if [ "$TOTAL_TESTS" -eq "${#IMAGES_AND_TESTS[@]}" ]; then
            PASSED_TESTS=$((PASSED_TESTS + 1))
            echo "✅ OVERALL: $image - ACCUKNOX COMPATIBLE"
          else
            FAILED_TESTS=$((FAILED_TESTS + 1))
            echo "❌ OVERALL: $image - POTENTIAL ACCUKNOX ISSUES"
          fi
          
          # Clean up
          docker rmi "$FULL_IMAGE" > /dev/null 2>&1 || true
          rm -f /tmp/pull_output /tmp/exec_output
          
          echo ""
        done
        
        echo ""
        echo "======================================"
        echo "FINAL VALIDATION SUMMARY"
        echo "======================================"
        echo "Build Environment: $(uname -m) ($([ "$(uname -m)" = "x86_64" ] && echo "AMD64" || echo "ARM64"))"
        echo "Docker Version: $(docker --version)"
        echo "Total Images Tested: $TOTAL_TESTS"
        echo "Successfully Pulled: $PASSED_TESTS"
        echo "Failed to Pull: $FAILED_TESTS"
        echo "Success Rate: $(( (PASSED_TESTS * 100) / TOTAL_TESTS ))%"
        echo ""
        
        # Report critical failures that would break AccuKnox
        if [ ${#CRITICAL_FAILURES[@]} -gt 0 ]; then
          echo "❌ CRITICAL FAILURES (Will break AccuKnox scanner):"
          for failure in "${CRITICAL_FAILURES[@]}"; do
            echo "   - $failure"
          done
          echo ""
          echo "🚨 AccuKnox scanner WILL FAIL in production with these issues!"
          exit 1
        fi
        
        if [ $FAILED_TESTS -eq 0 ]; then
          echo "🎉 ALL TESTS PASSED!"
          echo "✅ AccuKnox scanner will work correctly on this architecture"
          echo "✅ Images are compatible with both AMD64 and ARM64 build environments"
          echo "✅ Ready for production use in CodePipeline"
        else
          echo "⚠️  Some images failed - AccuKnox scanner may encounter issues"
          echo "🔧 Recommend fixing failed images before production deployment"
          exit 1
        fi
        
        echo ""
        echo "======================================"
        echo "TEST SUMMARY"
        echo "======================================"
        echo "Total tests: $TOTAL_TESTS"
        echo "Passed: $PASSED_TESTS"
        echo "Failed: $FAILED_TESTS"
        echo "Success rate: $(( (PASSED_TESTS * 100) / TOTAL_TESTS ))%"
        
        if [ $FAILED_TESTS -eq 0 ]; then
          echo "🎉 ALL TESTS PASSED - Multi-architecture images are working correctly!"
          echo "✅ Your images are ready for production use across all build environments"
        else
          echo "⚠️  Some tests failed - please review the failed images"
          exit 1
        fi

  post_build:
    commands:
      - echo "Multi-architecture image testing completed"
      - echo "Images verified for cross-platform compatibility"
      - echo "Ready for use in AMD64 and ARM64 build environments"

artifacts:
  files:
    - '**/*'
