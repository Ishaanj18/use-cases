version: 0.2

phases:
  pre_build:
    commands:
      - echo "Testing AccuKnox scanner command formats..."
      - export PIPELINE_ID="$CODEBUILD_BUILD_ID"
      - export JOB_URL="https://console.aws.amazon.com/codesuite/codebuild/projects/$CODEBUILD_PROJECT_NAME/builds/$CODEBUILD_BUILD_ID"
      
  build:
    commands:
      - echo "Test 1: Basic help command"
      - accuknox-aspm-scanner --help || echo "Help failed"
      - echo "Test 2: Check available scan types"
      - accuknox-aspm-scanner scan --help || echo "Scan help failed"
      - echo "Test 3: Try GitLab format"
      - accuknox-aspm-scanner scan --softfail sast --pipeline-id "$PIPELINE_ID" --job-url "$JOB_URL" || echo "GitLab format failed"
      - echo "Test 4: Try simpler format"
      - accuknox-aspm-scanner scan sast || echo "Simple format failed"
      - echo "Test 5: Try with token parameter"
      - accuknox-aspm-scanner scan --token $ACCUKNOX_TOKEN sast || echo "Token format failed"

artifacts:
  files:
    - '**/*'
