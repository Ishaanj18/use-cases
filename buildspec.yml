version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo "Installing AccuKnox scanner..."
      - pip install accuknox-aspm-scanner
  build:
    commands:
      - echo "Running AccuKnox scan..."
      # Replace <YOUR_TOKEN> with the actual AccuKnox Token from your SaaS account
      - accuknox-aspm-scanner scan --token $ACCUKNOX_TOKEN --softfail code --path .
artifacts:
  files:
    - '**/*'
