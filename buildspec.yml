version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing AccuKnox ASPM Scanner via pip"
      - pip install accuknox-aspm-scanner
      
  pre_build:
    commands:
      - echo "Starting Docker service in CodeBuild standard image"
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --host=tcp://0.0.0.0:2375 &
      - timeout 30 sh -c 'until docker info; do echo "Waiting for Docker..."; sleep 2; done'
      - echo "Docker daemon is ready"
      - docker info
      - echo "Authenticating with Docker Hub"
      - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
      
  build:
    commands:
      - echo "Running AccuKnox SAST scan"
      - export PIPELINE_ID="$CODEBUILD_BUILD_ID"  
      - export JOB_URL="https://console.aws.amazon.com/codesuite/codebuild/projects/$CODEBUILD_PROJECT_NAME/builds/$CODEBUILD_BUILD_ID"
      - export REPO_URL="https://github.com/IshaanJ18/use-cases"
      - export COMMIT_SHA="$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - export COMMIT_REF="main"
      - echo "Starting scan with Docker daemon available"
      - docker ps
      - accuknox-aspm-scanner scan --softfail sast --pipeline-id "$PIPELINE_ID" --job-url "$JOB_URL" --repo-url "$REPO_URL" --commit-sha "$COMMIT_SHA" --commit-ref "$COMMIT_REF"

artifacts:
  files:
    - '**/*'
