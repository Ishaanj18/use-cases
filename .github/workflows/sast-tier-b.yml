name: SAST Tier B (Updated Action)

on:
  workflow_dispatch:

jobs:
  # 1) Sanity: runner info
  runner-preflight:
    runs-on: [self-hosted, linux, accuknox-runner, local-repro]
    steps:
      - name: Runner diagnostics
        run: |
          echo "pwd=$(pwd)"
          uname -a
          uname -m
          id
          if [ -f /.dockerenv ]; then
            echo "container_runner=true"
          else
            echo "container_runner=false"
          fi
          docker version || true

  # 2) Test updated action in normal mode (soft_fail=false)
  sast-updated-action-hardfail:
    needs: runner-preflight
    runs-on: [self-hosted, linux, accuknox-runner, local-repro]
    steps:
      - uses: actions/checkout@v4

      - name: Run updated SAST action (hard fail policy)
        uses: accuknox/sast-scan-opengrep-action@YOUR_BRANCH_OR_SHA
        with:
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_label: pipeline
          severity: HIGH
          soft_fail: false
          accuknox_ai_analysis: false

      - name: Assert results file exists
        if: always()
        run: |
          ls -la results.json || (echo "results.json missing" && exit 1)

  # 3) Optional: prove workflow continuation behavior (soft_fail=true)
  sast-updated-action-softfail:
    needs: runner-preflight
    runs-on: [self-hosted, linux, accuknox-runner, local-repro]
    steps:
      - uses: actions/checkout@v4

      - name: Run updated SAST action (soft fail policy)
        uses: accuknox/sast-scan-opengrep-action@YOUR_BRANCH_OR_SHA
        with:
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_label: pipeline
          severity: HIGH
          soft_fail: true
          accuknox_ai_analysis: false

      - name: Assert results file exists even with findings
        if: always()
        run: |
          ls -la results.json || (echo "results.json missing" && exit 1)
