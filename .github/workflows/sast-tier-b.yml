name: SAST Tier B

on:
  workflow_dispatch:

jobs:
  sast-broken:
    runs-on: [self-hosted, linux, accuknox-runner, local-repro]
    steps:
      - uses: actions/checkout@v4

      - name: Download AccuKnox CLI
        run: |
          curl -fsSL -o accuknox-aspm-scanner \
            https://github.com/accuknox/aspm-scanner-cli/releases/download/v0.14.6/accuknox-aspm-scanner
          chmod +x accuknox-aspm-scanner

      - name: Container mode (expect fail / expect results.json missing)
        continue-on-error: true
        run: |
          set +e
          ./accuknox-aspm-scanner scan --skip-upload --keep-results \
            sast --command "." --container-mode --severity HIGH
          scan_rc=$?
          set -e

          echo "container-mode scan_exit_code=$scan_rc"

          echo "Checking results.json..."
          ls -la results.json || echo "MISSING (expected)"
          if [ -f results.json ]; then
            echo "UNEXPECTED: results.json exists"
            exit 1
          fi

  sast-fix:
    needs: sast-broken
    runs-on: [self-hosted, linux, accuknox-runner, local-repro]
    steps:
      - uses: actions/checkout@v4

      - name: Download AccuKnox CLI
        run: |
          curl -fsSL -o accuknox-aspm-scanner \
            https://github.com/accuknox/aspm-scanner-cli/releases/download/v0.14.6/accuknox-aspm-scanner
          chmod +x accuknox-aspm-scanner

      - name: Native mode fix (expect results.json exists)
        run: |
          # Scan may fail due to HIGH findings, but we still want to verify results.json is produced.
          set +e
          ./accuknox-aspm-scanner tool install --type sast
          install_rc=$?

          ./accuknox-aspm-scanner scan --skip-upload --keep-results \
            sast --command "." --severity HIGH
          scan_rc=$?

          set -e
          echo "install_exit_code=$install_rc"
          echo "native scan_exit_code=$scan_rc"

          echo "Checking results.json..."
          ls -la results.json
          test -s results.json
