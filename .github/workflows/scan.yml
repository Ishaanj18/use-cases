name: AccuKnox Container Scan

on:
  push:
    branches:
      - all
  workflow_dispatch:

jobs:
  scan-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: "Run AccuKnox Container Scan"
        uses: ./
        with:
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_label: "evelabel"
          accuknox_endpoint: "cspm.dev.accuknox.com"
          image_name: "alpine"
          tag: "latest"
          soft_fail: true
          generate_sbom: true
          project_name: "testsbom"
          keep_results: true
