name: Cloud Compliance Report Export

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CSPM Report
        id: cspm
        uses: ./.github/actions/cspm-report
        with:
          cspm_access_token: ${{ secrets.CSPM_ACCESS_TOKEN }}
          account_id: "075565429331"
          toolkit_base_url: "https://toolkit.demo.accuknox.com"
          report_name: "CSPM Report"
          ticket_summary: "true"
          asset_summary: "true"
          report_type: "cspm"
          compliance_program: "AWS CIS Benchmark v4.0.1"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cspm-report
          path: ${{ steps.cspm.outputs.report_path }}
