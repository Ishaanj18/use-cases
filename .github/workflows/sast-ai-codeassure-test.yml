name: Test AI SAST (CodeAssure)

# Model settings come from repo Variables; the key comes from repo Secrets.
#   Variables: CODEASSURE_PROVIDER, CODEASSURE_MODEL, CODEASSURE_API_BASE (optional)
#   Secrets:   CODEASSURE_API_KEY
on:
  workflow_dispatch:

jobs:
  sast-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Run Accuknox SAST: Opengrep + CodeAssure"
        uses: ./.github/actions/sast-opengrep
        with:
          accuknox_endpoint: cspm.demo.accuknox.com
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_label: newLabel
          soft_fail: "true"
          severity: "HIGH"
          scanner_version: v0.15.1
          accuknox_ai_analysis: "true"
          codeassure_provider: ${{ vars.CODEASSURE_PROVIDER }}
          codeassure_model: ${{ vars.CODEASSURE_MODEL }}
          codeassure_api_base: ${{ vars.CODEASSURE_API_BASE }}
          codeassure_api_key: ${{ secrets.CODEASSURE_API_KEY }}

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-ai-results
          path: results.json
          if-no-files-found: warn
