name: Test AI SAST (OpenRouter)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model id"
        required: false
        default: "anthropic/claude-sonnet-4.6"

jobs:
  sast-ai-openrouter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Run Accuknox SAST: Opengrep + CodeAssure (OpenRouter)"
        uses: ./.github/actions/sast-opengrep
        with:
          accuknox_endpoint: cspm.demo.accuknox.com
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_label: newLabel
          soft_fail: "true"
          severity: "HIGH"
          scanner_version: v0.15.1
          accuknox_ai_analysis: "true"
          codeassure_provider: openai-compatible
          codeassure_model: ${{ inputs.model || 'anthropic/claude-sonnet-4.6' }}
          codeassure_api_base: https://openrouter.ai/api/v1
          codeassure_api_key: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-ai-openrouter-results
          path: results.json
          if-no-files-found: warn
